<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS padrão do site -->
    <link rel="stylesheet" href="css/style.css">

    <title>Dar Alta</title>
</head>

<body>

    <div class="container">

        <h2>📄 Alta do Paciente</h2>

        <hr>

        <h3>👤 Dados do Paciente</h3>

        <div class="form-row">

            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="nome" readonly>
            </div>

            <div class="form-group">
                <label>CPF</label>
                <input type="text" id="cpf" readonly>
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Data de nascimento</label>
                <input type="text" id="data_nascimento" readonly>
            </div>

            <div class="form-group">
                <label>Sexo</label>
                <input type="text" id="sexo" readonly>
            </div>

        </div>

        <div class="form-group">
            <label>Telefone</label>
            <input type="text" id="telefone" readonly>
        </div>

        <hr>

        <h3>🩺 Informações da Alta</h3>

        <div class="form-group">
            <label>Diagnóstico</label>
            <textarea id="diagnostico" placeholder="Informe o diagnóstico do paciente"></textarea>
        </div>

        <div class="form-group">
            <label>Condição na alta</label>
            <select id="condicao">
                <option value="">Selecione</option>
                <option value="Estável">Estável</option>
                <option value="Melhorado">Melhorado</option>
                <option value="Curado">Curado</option>
                <option value="Encaminhado">Encaminhado</option>
            </select>
        </div>

        <div class="form-group">
            <label>Medicação / Prescrição</label>
            <textarea id="medicacao"
                placeholder="Informe medicamentos ou prescrições"></textarea>
        </div>

        <div class="form-group">
            <label>Orientações ao paciente</label>
            <textarea id="orientacoes"
                placeholder="Informe as orientações para o paciente"></textarea>
        </div>

        <div class="form-group">
            <label>Retorno / Acompanhamento</label>
            <textarea id="retorno"
                placeholder="Informe se será necessário retorno ou acompanhamento"></textarea>
        </div>

        <hr>

        <h3>👨‍⚕️ Responsável</h3>

        <div class="form-row">

            <div class="form-group">
                <label>Nome do médico</label>
                <input type="text" id="medico" placeholder="Nome do médico">
            </div>

            <div class="form-group">
                <label>CRM</label>
                <input type="text" id="crm" placeholder="CRM">
            </div>

        </div>

        <div class="form-group">
            <label>Data da alta</label>
            <input type="date" id="data_alta">
        </div>

        <hr>

        <div class="form-row">

            <button onclick="window.history.back()">
                ← Voltar
            </button>

            <button onclick="gerarPDF()">
                📄 Gerar PDF
            </button>

        </div>

    </div>

    <script>

        // Pega o nome enviado pela página do médico
        const params = new URLSearchParams(window.location.search);
        const nomePaciente = params.get("nome");

        async function carregarPaciente() {

            if (!nomePaciente) {
                alert("Paciente não informado.");
                return;
            }

            try {

                const resposta = await fetch("/pacientes");
                const pacientes = await resposta.json();

                const paciente = pacientes.find(
                    p => p.nome === nomePaciente
                );

                if (!paciente) {
                    alert("Paciente não encontrado.");
                    return;
                }

                document.getElementById("nome").value =
                    paciente.nome || "";

                document.getElementById("cpf").value =
                    paciente.cpf || "";

                document.getElementById("data_nascimento").value =
                    paciente.data_nascimento || "";

                document.getElementById("sexo").value =
                    paciente.sexo || "";

                document.getElementById("telefone").value =
                    paciente.telefone || "";

            } catch (erro) {

                console.error("Erro ao carregar paciente:", erro);
                alert("Erro ao carregar os dados do paciente.");

            }
        }

        function gerarPDF() {

            window.print();

        }

        // Coloca a data atual automaticamente
        const hoje = new Date().toISOString().split("T")[0];
        document.getElementById("data_alta").value = hoje;

        carregarPaciente();

    </script>

</body>

</html>
