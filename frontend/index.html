<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <h2 > Health Vision</h2><center>
  <img src="logo.png" alt="" height="200" width="200" >
  </center>
  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<script>
function login() {
  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;

  fetch("/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ usuario, senha })
  })
  .then(async response => {
    const data = await response.json();

    console.log("STATUS:", response.status);
    console.log("RESPOSTA:", data);

    if (!response.ok) {
      alert("Erro: " + (data.erro || "falha no login"));
      return;
    }

    if (data.tipo === "triagem") {
      window.location.href = "/triagem.html";
    } else if (data.tipo === "medico") {
      window.location.href = "/medico.html";
    } else if (data.tipo === "atendimento") {
      window.location.href = "/atendimento.html";
    } else {
      alert("Tipo de usuário desconhecido: " + data.tipo);
    }
  })
  .catch(error => {
    console.error(error);
    alert("Não foi possível conectar ao servidor.");
  });
}
</script>
</body> 
</html>
