<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .btn-tv {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }
    .btn-tv:hover {background: #1e7e34;}
    .btn-abrir-tv {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }
    .btn-abrir-tv:hover {background: #117a8b;}
   .consultorio-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: #f0f4ff;
      padding: 10px 14px;
      border: 1px solid #d0d8f0;
    }
    .consultorio-input label {font-weight: bold;}
    .consultorio-input input {
      width: 60px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
  
<body>
 <div class="container">
 <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
  <h2 >🩺 Painel Médico</h2>
</div>


  <div id="triagens"></div>

  <hr>

  <h3>Consulta</h3>

  <input id="paciente" placeholder="Paciente" readonly>

  <input id="diagnostico" placeholder="Diagnóstico">

  <select id="medicacao">
    <option value="">Selecione a medicação</option>
  </select>

  <textarea id="obs" placeholder="Observações"></textarea>

  <button onclick="salvar()">Salvar</button>

</div>

<script>

let triagensCarregadas = [];




async function carregar() {
  try {
    const [resTriagens, resPacientes] = await Promise.all([
      fetch("/triagens"),
      fetch("/pacientes")
    ]);

    const triagens = await resTriagens.json();
    const pacientes = await resPacientes.json();

    triagensCarregadas = triagens;

    const div = document.getElementById("triagens");
    div.innerHTML = "";

    triagens.forEach((t, index) => {

      // Encontra o cadastro completo do paciente
      const paciente = pacientes.find(p => p.nome === t.nome) || {};

      div.innerHTML += `
        <div class="card">

          <h3>${t.nome}</h3>

          <h4>📋 Dados do paciente</h4>

          <p><b>CPF:</b> ${paciente.cpf || "Não informado"}</p>

          <p><b>Data de nascimento:</b> 
            ${paciente.data_nascimento || "Não informada"}
          </p>

          <p><b>Sexo:</b> 
            ${paciente.sexo || "Não informado"}
          </p>

          <p><b>Nome materno:</b> 
            ${paciente.nome_mae || "Não informado"}
          </p>

          <p><b>Estado civil:</b> 
            ${paciente.estado_civil || "Não informado"}
          </p>

          <p><b>Endereço:</b> 
            ${paciente.endereco || "Não informado"}
          </p>

          <p><b>Telefone:</b> 
            ${paciente.telefone || "Não informado"}
          </p>

          <p><b>E-mail:</b> 
            ${paciente.email || "Não informado"}
          </p>

          <p><b>Contato de emergência:</b> 
            ${paciente.contato_emergencia || "Não informado"}
          </p>

          <hr>

          <h4>🩺 Dados da triagem</h4>

          <p><b>Sintoma:</b> 
            ${t.sintoma || "Não informado"}
          </p>

          <p><b>Temperatura:</b> 
            ${t.temperatura || "Não informada"}°C
          </p>

          <p>
            <span class="${t.risco}">
              ${t.risco}
            </span>
          </p>

          <p><b>Alergia:</b> 
            ${t.alergia || "Nenhuma"}
          </p>

          <p><b>Observação:</b> 
            ${t.observacao || "Nenhuma"}
          </p>

          <button class="btn-abrir-tv" onclick="selecionar(${index})">
            Atender
          </button>

        </div>
      `;
    });

  } catch (erro) {
    console.error("Erro ao carregar dados:", erro);
  }
}

function selecionar(index) {
  const t = triagensCarregadas[index];

  document.getElementById("paciente").value = t.nome;
  document.getElementById("obs").value = t.observacao || "";

  if (t.alergia && t.alergia !== "Nenhuma") {
    alert("⚠️ Paciente possui alergia: " + t.alergia);
  }
}

function carregarMedicacoes() {
  fetch("/lista-medicacoes")
    .then(r => r.json())
    .then(data => {
      const select = document.getElementById("medicacao");

      select.innerHTML = `
        <option value="">Selecione a medicação</option>
      `;

      data.forEach(med => {
        const option = document.createElement("option");
        option.value = med;
        option.textContent = med;
        select.appendChild(option);
      });
    });
}

function salvar() {
  const paciente = document.getElementById("paciente").value;
  const diagnostico = document.getElementById("diagnostico").value;
  const medicacao = document.getElementById("medicacao").value;
  const obs = document.getElementById("obs").value;

  if (!paciente) {
    alert("Selecione um paciente clicando em Atender.");
    return;
  }

  if (!medicacao) {
    alert("Selecione uma medicação.");
    return;
  }

  fetch("/consulta", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      paciente,
      diagnostico,
      medicacao,
      obs
    })
  })
  .then(r => r.json())
  .then(() => {
    alert("Consulta salva");

    document.getElementById("diagnostico").value = "";
    document.getElementById("medicacao").value = "";
    document.getElementById("obs").value = "";
  });
}

carregar();
carregarMedicacoes();

</script>

</body>
</html>
