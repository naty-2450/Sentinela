<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">

  <title>Triagem</title>
</head>

<body>

  <div class="container">

    <h2>🩺 Painel de Triagem</h2>

    <div id="pacientes"></div>

  </div>

  <script>

    async function carregarPacientes() {

      try {

        const resposta = await fetch("/pacientes");
        const pacientes = await resposta.json();

        const div = document.getElementById("pacientes");

        div.innerHTML = "";

        if (pacientes.length === 0) {

          div.innerHTML =
            "<p style='text-align:center; color:#aaa;'>Nenhum paciente aguardando triagem.</p>";

          return;
        }

        pacientes.forEach((p, index) => {

          div.innerHTML += `

            <div class="card">

              <h3>${p.nome}</h3>

              <h4>📋 Dados do paciente</h4>

              <p><b>CPF:</b> ${p.cpf || "Não informado"}</p>

              <p><b>Data de nascimento:</b>
                ${p.data_nascimento || "Não informada"}
              </p>

              <p><b>Sexo:</b>
                ${p.sexo || "Não informado"}
              </p>

              <p><b>Nome materno:</b>
                ${p.nome_mae || "Não informado"}
              </p>

              <p><b>Estado civil:</b>
                ${p.estado_civil || "Não informado"}
              </p>

              <p><b>Endereço:</b>
                ${p.endereco || "Não informado"}
              </p>

              <p><b>Telefone:</b>
                ${p.telefone || "Não informado"}
              </p>

              <p><b>E-mail:</b>
                ${p.email || "Não informado"}
              </p>

              <p><b>Contato de emergência:</b>
                ${p.contato_emergencia || "Não informado"}
              </p>

              <hr>

              <h4>🩺 Realizar triagem</h4>

              <label>Sintoma</label>
              <input
                type="text"
                id="sintoma-${index}"
                placeholder="Informe o sintoma"
              >

              <label>Temperatura</label>
              <input
                type="number"
                step="0.1"
                id="temperatura-${index}"
                placeholder="Ex: 37.5"
              >

              <label>Alergia</label>
              <input
                type="text"
                id="alergia-${index}"
                placeholder="Informe a alergia ou escreva Nenhuma"
              >

              <label>Observação</label>
              <textarea
                id="observacao-${index}"
                placeholder="Observações da triagem"
              ></textarea>

              <label>Classificação de risco</label>

              <select id="risco-${index}">

                <option value="verde">
                  🟢 Verde
                </option>

                <option value="amarelo">
                  🟡 Amarelo
                </option>

                <option value="vermelho">
                  🔴 Vermelho
                </option>

              </select>

              <button onclick="salvarTriagem(${index})">
                Salvar Triagem
              </button>

            </div>

          `;

        });

      } catch (erro) {

        console.error("Erro ao carregar pacientes:", erro);

      }

    }


    async function salvarTriagem(index) {

      try {

        const respostaPacientes = await fetch("/pacientes");
        const pacientes = await respostaPacientes.json();

        const paciente = pacientes[index];

        const sintoma =
          document.getElementById(`sintoma-${index}`).value;

        const temperatura =
          document.getElementById(`temperatura-${index}`).value;

        const alergia =
          document.getElementById(`alergia-${index}`).value || "Nenhuma";

        const observacao =
          document.getElementById(`observacao-${index}`).value;

        const risco =
          document.getElementById(`risco-${index}`).value;


        if (!sintoma) {

          alert("Informe o sintoma do paciente.");
          return;

        }


        if (!temperatura) {

          alert("Informe a temperatura do paciente.");
          return;

        }


        const resposta = await fetch("/triagem", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            nome: paciente.nome,
            sintoma: sintoma,
            temperatura: temperatura,
            alergia: alergia,
            observacao: observacao,
            risco: risco

          })

        });


        if (!resposta.ok) {

          throw new Error("Erro ao salvar triagem.");

        }


        alert("✅ Triagem salva com sucesso!");

        carregarPacientes();

      } catch (erro) {

        console.error("Erro:", erro);

        alert("❌ Não foi possível salvar a triagem.");

      }

    }


    carregarPacientes();


  </script>

</body>

</html>
