<!DOCTYPE html>
<html><head>
  <link rel="stylesheet" href="css/style.css">
<body>
<div class="container">
<h2>Atendimento</h2>

<input id="nome" placeholder="Nome">
<input id="cpf" placeholder="CPF">
<input type="date" id="data-nascimento" name="data_nascimento">
<input id="sexo" placeholder="Sexo">
<input id="nome-mae" placeholder="Nome Materno">
<select id="estado-civil">
  <option>Solteiro(a)</option>
  <option>Casado(a)</option>
  <option>Divorciado(a)</option>
  <option>Viúvo(a)</option>
</select>
<input id="endereco" placeholder="Endereço Completo">
<input id="telefone" placeholder="Telefone">
<input id="email" placeholder="E-mail">
<input id="contato-emergencia" placeholder="Contato de Emergência">

<select id="tipo">
  <option>Convenio</option>
  <option>Particular</option>
</select>

<input type="file" id="foto">

<button onclick="cadastrar()">Cadastrar</button>
</div>

<script>
async function cadastrar() {
  try {
    const resposta = await fetch("http://localhost:3000/atendimento", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        nome: document.getElementById("nome").value,
        cpf: document.getElementById("cpf").value,
        data_nascimento: document.getElementById("data-nascimento").value,
        sexo: document.getElementById("sexo").value,
        nome_mae: document.getElementById("nome-mae").value,
        estado_civil: document.getElementById("estado-civil").value,
        endereco: document.getElementById("endereco").value,
        telefone: document.getElementById("telefone").value,
        email: document.getElementById("email").value,
        contato_emergencia: document.getElementById("contato-emergencia").value,
        tipo: document.getElementById("tipo").value
      })
    });

    if (!resposta.ok) {
      throw new Error("Erro ao cadastrar paciente");
    }

    const paciente = await resposta.json();

    console.log("Paciente cadastrado:", paciente);

    alert("Paciente enviado para triagem!");

  } catch (erro) {
    console.error(erro);
    alert("Erro ao cadastrar o paciente.");
  }
}
</script>
</body>
</html>
